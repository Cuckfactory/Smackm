function audioCtx(){if(!window._ac)window._ac=new (window.AudioContext||window.webkitAudioContext)();return window._ac}function whipSound(){const ac=audioCtx(),now=ac.currentTime,dur=.12,len=Math.floor(ac.sampleRate*dur),buf=ac.createBuffer(1,len,ac.sampleRate),data=buf.getChannelData(0);for(let i=0;i<len;i++){const t=i/len;data[i]=(Math.random()*2-1)*Math.pow(1-t,4)}const src=ac.createBufferSource();src.buffer=buf;const bp=ac.createBiquadFilter();bp.type='bandpass';bp.frequency.setValueAtTime(1800,now);bp.Q.value=.9;const g=ac.createGain();g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.55,now+.006);g.gain.exponentialRampToValueAtTime(.0001,now+.12);src.connect(bp).connect(g).connect(ac.destination);src.start(now);const osc=ac.createOscillator(),og=ac.createGain();osc.type='square';osc.frequency.setValueAtTime(950,now);osc.frequency.exponentialRampToValueAtTime(160,now+.035);og.gain.setValueAtTime(.16,now);og.gain.exponentialRampToValueAtTime(.0001,now+.05);osc.connect(og).connect(ac.destination);osc.start(now);osc.stop(now+.055)}function badSound(){const ac=audioCtx(),now=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type='sawtooth';o.frequency.setValueAtTime(130,now);o.frequency.exponentialRampToValueAtTime(70,now+.16);g.gain.setValueAtTime(.16,now);g.gain.exponentialRampToValueAtTime(.0001,now+.18);o.connect(g).connect(ac.destination);o.start(now);o.stop(now+.2)}function showFlash(k){flash.className='flash '+k;setTimeout(()=>flash.className='flash',190)}function showSlash(e){const r=document.getElementById('game').getBoundingClientRect();slash.style.left=((e.clientX-r.left)/r.width*100-3)+'%';slash.style.top=((e.clientY-r.top)/r.height*100)+'%';slash.classList.remove('show');void slash.offsetWidth;slash.classList.add('show')}function updateCombo(){if(combo>=2){comboEl.textContent='COMBO ×'+combo;comboEl.classList.add('show')}else comboEl.classList.remove('show')}
function popOne(){if(!running)return;const holes=[...document.querySelectorAll('.hole')],free=holes.map((h,i)=>active.has(i)?null:i).filter(v=>v!==null);if(!free.length)return;const i=free[Math.floor(Math.random()*free.length)],hole=holes[i],im=hole.querySelector('.sprite');const type=Math.random()<.09?'carrot':types[Math.floor(Math.random()*types.length)];im.src=SPRITES[type];hole.classList.add('up');active.set(i,type);const elapsed=30000-(endAt-performance.now()),life=Math.max(360,900-elapsed/75-Math.min(score,40)*5);setTimeout(()=>{if(active.get(i)===type){hole.classList.remove('up');active.delete(i);if(type!=='carrot'&&running){misses++;combo=0;updateCombo()}}},life)}
function whack(i,e){if(!running||!active.has(i))return;const hole=document.querySelectorAll('.hole')[i],type=active.get(i);active.delete(i);hole.classList.add('hit');hole.classList.remove('up');setTimeout(()=>hole.classList.remove('hit'),150);showSlash(e);whipSound();if(type==='carrot'){wrong++;score=Math.max(0,score-5);combo=0;badSound();showFlash('bad')}else{hits++;combo++;maxCombo=Math.max(maxCombo,combo);score+=combo>=20?3:combo>=10?2:1;showFlash('good')}scoreEl.textContent=score;updateCombo()}
function schedule(){if(!running)return;popOne();const elapsed=30000-(endAt-performance.now());let interval=Math.max(210,650-elapsed/85-score*4);if(Math.random()<.20)setTimeout(popOne,Math.max(90,interval*.35));loopTimer=setTimeout(schedule,interval)}function tick(){if(!running)return;const left=endAt-performance.now();timerEl.textContent=Math.max(0,left/1000).toFixed(1);if(left<=0)return finish();raf=requestAnimationFrame(tick)}function startGame(){audioCtx().resume();running=true;score=0;combo=0;maxCombo=0;hits=0;wrong=0;misses=0;scoreEl.textContent='0';timerEl.textContent='30.0';updateCombo();startBtn.style.visibility='hidden';result.classList.remove('show');document.querySelectorAll('.hole').forEach(h=>h.classList.remove('up','hit'));active.clear();endAt=performance.now()+30000;schedule();tick()}function finish(){running=false;clearTimeout(loopTimer);cancelAnimationFrame(raf);active.clear();document.querySelectorAll('.hole').forEach(h=>h.classList.remove('up','hit'));if(score>best){best=score;localStorage.setItem('whackm_best',best);bestEl.textContent=best}finalScoreEl.textContent=score;statsEl.innerHTML=`HITS&nbsp;&nbsp;${hits}<br>CARROTS HIT&nbsp;&nbsp;${wrong}<br>MISSES&nbsp;&nbsp;${misses}<br>BEST COMBO&nbsp;&nbsp;×${maxCombo}`;result.classList.add('show');startBtn.style.visibility='visible'}startBtn.addEventListener('click',startGame);againBtn.addEventListener('click',startGame);
</script></body></html>
